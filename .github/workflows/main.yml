name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          ADA11E: ${{ secrets.ADA11E }}
          B1E1B5: ${{ secrets.B1E1B5 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('ADA11E', '')
          bm = os.environ.get('B1E1B5', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 4d5a7175ac4b99c5744e2e8c66 -->', gm)
          if bm:
              s2 = s2.replace('<!-- f17a2ba0b589ab05d3ec14 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
